<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{-webkit-text-size-adjust:100%;background:var(--bg);padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="韓国語レッスン">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12181a" media="(prefers-color-scheme: dark)">
<title>韓国語レッスン</title>
</head>
<body>
<style>
/* レイアウト: 単一カラム。ホーム＝ユニットをプルダウンで選び、その5レッスンの道筋だけを出す。レッスン＝1問ずつ、正誤は画面下のパネル。結果＝マスコットの労いとXP */
:root{
  --bg:#f6f4ef; --surface:#ffffff; --fg:#1f2a30; --muted:#66727a; --line:#dcd8cf; --line-d:#c4bfb3;
  --accent:#0f7b6c; --accent-d:#0a5a4f; --accent-soft:#dff1ec; --accent-fg:#ffffff;
  --ok:#1c7a4c; --ok-soft:#e2f3ea; --ng:#b2352e; --ng-soft:#fae6e4; --gold:#b86e0c; --gold-soft:#fbeed8; --star:#e2a100;
  --font-body:"BIZ UDPGothic","Yu Gothic UI","Hiragino Sans","Meiryo",system-ui,sans-serif;
  --font-ko:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","BIZ UDPGothic",system-ui,sans-serif;
  --font-num:"BIZ UDGothic","Consolas","Menlo",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12181a; --surface:#1a2326; --fg:#e6ecee; --muted:#96a4aa; --line:#2e3b40; --line-d:#232d31;
  --accent:#4fc3ae; --accent-d:#2f8f7e; --accent-soft:#17362f; --accent-fg:#08201b;
  --ok:#5cc58f; --ok-soft:#173226; --ng:#ee7f76; --ng-soft:#3a1d1b; --gold:#e9a94a; --gold-soft:#3a2b12; --star:#f0bd3a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181a; --surface:#1a2326; --fg:#e6ecee; --muted:#96a4aa; --line:#2e3b40; --line-d:#232d31;
  --accent:#4fc3ae; --accent-d:#2f8f7e; --accent-soft:#17362f; --accent-fg:#08201b;
  --ok:#5cc58f; --ok-soft:#173226; --ng:#ee7f76; --ng-soft:#3a1d1b; --gold:#e9a94a; --gold-soft:#3a2b12; --star:#f0bd3a; color-scheme:dark}
/* ユニットのテーマ色: --u 色面、--ud 影、--ut 地の上に置く文字と線（ダークでは明るくする） */
.th0{--u:#0f7b6c;--ud:#0a5a4f;--ut:#0f7b6c} .th1{--u:#c2610c;--ud:#8f4505;--ut:#b3580a} .th2{--u:#2563a8;--ud:#1a4779;--ut:#2563a8} .th3{--u:#6b4aa8;--ud:#4c3380;--ut:#6b4aa8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .th0{--ut:#4fc3ae} :root:not([data-theme="light"]) .th1{--ut:#f0a35c} :root:not([data-theme="light"]) .th2{--ut:#7fb3ec} :root:not([data-theme="light"]) .th3{--ut:#b39ae6}}
:root[data-theme="dark"] .th0{--ut:#4fc3ae} :root[data-theme="dark"] .th1{--ut:#f0a35c} :root[data-theme="dark"] .th2{--ut:#7fb3ec} :root[data-theme="dark"] .th3{--ut:#b39ae6}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.7;margin:0}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:14px 56px}
h1,h2,h3{text-wrap:balance;line-height:1.35;margin:0}
h1{font-size:1.2rem} h2{font-size:1.2rem} h3{font-size:1rem}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.85rem}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.label{font-size:.75rem;letter-spacing:.08em;color:var(--muted)}
.ko{font-family:var(--font-ko)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* 押しボタン: 下に影を付けて立体に見せ、押すと沈む */
.btn{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 18px;min-height:46px;font-weight:700;box-shadow:0 3px 0 var(--line-d);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled),.opt:active:not(:disabled),.tile:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);box-shadow:0 4px 0 var(--accent-d)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btn.link{border:0;background:none;box-shadow:none;font-weight:400;color:var(--muted);text-decoration:underline}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.icon{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tiger{flex:none;display:block}
.talk .tiger,.namecard .tiger{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}

/* ヘッダー */
.head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.head h1{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;gap:6px;align-items:center;flex:none}
.pill{display:flex;gap:4px;align-items:center;font-weight:700;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 8px;min-height:40px}
.pill.streak{color:var(--gold)} .pill.streak.off{color:var(--muted)}
.ring{flex:none;transform:rotate(-90deg)}
.ring .bg{stroke:var(--line)} .ring .fg{stroke:var(--gold);transition:stroke-dasharray .6s}
.iconbtn{border:0;background:none;padding:10px;border-radius:12px;display:grid;place-items:center}
.iconbtn:hover{background:var(--accent-soft)}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .3s}

/* マスコットと吹き出し */
.talk{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.bubble{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px;display:grid;gap:2px}
.bubble::before{content:"";position:absolute;left:-7px;top:50%;width:12px;height:12px;background:var(--surface);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.bubble .who{font-weight:700}
.bubble .kline{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;margin-top:4px;padding-top:8px;border-top:1px dashed var(--line)}
.bubble .kline:not(:has(.say)){grid-template-columns:1fr}
.bubble .kline .ja{display:block}

/* ユニットのプルダウン */
.picker{display:grid;grid-template-columns:46px 1fr 46px;gap:8px;align-items:stretch}
.picker .btn{padding:0;font-size:1.2rem}
.picker select{width:100%;min-height:46px;border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:0 12px;font-weight:700;box-shadow:0 3px 0 var(--line-d)}
/* ユニットの見出し */
.hero{position:relative;overflow:hidden;background:var(--u);color:#fff;border-radius:20px;padding:16px 18px;display:grid;gap:4px;box-shadow:0 5px 0 var(--ud)}
.hero .label{color:#fff;opacity:.9}
.hero .deco{position:absolute;right:6px;top:-18px;font-family:var(--font-ko);font-size:7.5rem;font-weight:700;line-height:1;opacity:.18;pointer-events:none}
.hero .bar{background:rgba(255,255,255,.3);margin-top:6px;max-width:260px} .hero .bar i{background:#fff}
.hero .btn{justify-self:start;margin-top:8px;color:var(--fg);border-color:transparent;box-shadow:0 3px 0 var(--ud)}
.hero.locked{background:var(--surface);color:var(--fg);border:2px dashed var(--line);box-shadow:none}
.hero.locked .label{color:var(--muted)} .hero.locked .deco{opacity:.07} .hero.locked .bar{background:var(--line)} .hero.locked .bar i{background:var(--muted)}
/* レッスンの道筋 */
.path{position:relative;display:grid}
.path svg.rail{position:absolute;left:0;top:0;pointer-events:none}
.path svg.rail path{fill:none;stroke:var(--line);stroke-width:6;stroke-linecap:round;stroke-dasharray:1 14}
.node{position:relative;display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;height:88px;text-align:left;border:0;background:none;padding:0;margin-left:calc(var(--x)*1px)}
.node .dot{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-num);font-size:1.3rem;font-weight:700;
  background:var(--surface);border:3px solid var(--line);color:var(--muted);box-shadow:0 5px 0 var(--line-d);transition:transform .08s,box-shadow .08s}
.node.open .dot{border-color:var(--ut);color:var(--ut)}
.node.done .dot{background:var(--u);border-color:var(--u);color:#fff;box-shadow:0 5px 0 var(--ud)}
.node.next .dot{background:var(--u);border-color:var(--u);color:#fff;box-shadow:0 5px 0 var(--ud);animation:pulse 1.8s infinite}
.node:active:not(:disabled) .dot{transform:translateY(4px);box-shadow:none}
.node:disabled{cursor:default}
.node .name{min-width:0;font-weight:700;line-height:1.4}
.node:disabled .name{color:var(--muted)}
.node .name small{display:block;font-weight:400;color:var(--muted)}
.node .here{display:inline-block;font-size:.72rem;background:var(--u);color:#fff;border-radius:999px;padding:0 10px;margin-left:6px;vertical-align:2px}
.stars{color:var(--line);letter-spacing:2px;font-size:.9rem} .stars b{color:var(--star);font-weight:400}
@keyframes pulse{0%{outline:0 solid color-mix(in srgb,var(--u) 45%,transparent)}70%{outline:12px solid transparent}100%{outline:0 solid transparent}}
.node.next .dot{outline-offset:0}

/* レッスンの前 */
.vocab{display:grid;gap:2px}
.vrow{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.vrow .k{font-size:1.2rem;font-weight:700}
.rd{color:var(--muted);font-size:.85rem}
.tip{background:var(--accent-soft);border-radius:14px;padding:12px 14px}

/* 出題 */
.qbar{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.rtoggle{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.82rem;min-height:36px;white-space:nowrap}
.prompt{display:grid;gap:4px;justify-items:start;min-height:84px;align-content:center}
.prompt:empty{display:none}
.prompt .big{font-size:1.9rem;font-weight:700;line-height:1.4}
.prompt .big.ja{font-size:1.3rem}
.prompt .big.letter{font-size:3.4rem}
.say{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;min-height:40px}
.say.big{padding:18px 26px;font-size:1.05rem;font-weight:700;border:0;background:var(--accent);color:var(--accent-fg);box-shadow:0 4px 0 var(--accent-d);border-radius:18px}
.opts{display:grid;gap:12px}
.opts.two,.opts.pairs{grid-template-columns:1fr 1fr}
.opt{display:grid;gap:0;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 14px;min-height:54px;align-content:center;box-shadow:0 3px 0 var(--line-d);transition:transform .08s,box-shadow .08s}
.opt .t{font-size:1.05rem;font-weight:700;overflow-wrap:anywhere}
.opt .t.ko{font-size:1.3rem}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 3px 0 var(--ok);animation:pop .3s}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft);box-shadow:0 3px 0 var(--ng);animation:shake .35s}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 3px 0 var(--accent)}
.opt.gone{opacity:.35;animation:none;box-shadow:none}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.blank{display:inline-block;min-width:3em;border-bottom:3px solid var(--accent);text-align:center;color:var(--accent)}
.line{min-height:66px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;padding-bottom:10px}
.bank{display:flex;flex-wrap:wrap;gap:8px;min-height:60px}
.tile{display:grid;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;text-align:center;min-height:46px;align-content:center;box-shadow:0 3px 0 var(--line-d);transition:transform .08s,box-shadow .08s}
.tile .ko{font-size:1.2rem;font-weight:700}
.tile.used{visibility:hidden}
/* 正誤のパネル（画面下に固定。出ている間は本文の下に同じだけ余白を取る） */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;border-top:2px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));animation:rise .2s}
.sheet.ok{background:var(--ok-soft);border-color:var(--ok)} .sheet.ng{background:var(--ng-soft);border-color:var(--ng)}
.sheet .in{max-width:608px;margin:0 auto;display:grid;gap:10px}
.sheet .top{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.verdict{font-weight:700;font-size:1.15rem}
.sheet.ok .verdict{color:var(--ok)} .sheet.ng .verdict{color:var(--ng)}
.answer{display:grid;gap:0;min-width:0}
.answer .ko{font-size:1.25rem;font-weight:700}
.sheetpad{height:230px}
@keyframes rise{from{transform:translateY(30%);opacity:0}}

/* 結果・設定・名前 */
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.score .cell{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 8px;text-align:center;display:grid;gap:2px;justify-items:center;align-content:start}
.score .v{font-family:var(--font-num);font-size:1.7rem;font-weight:700;line-height:1.2}
.score .xp .v{color:var(--gold)}
.goalrow{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;min-height:44px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);font-weight:700}
.setrow{display:grid;gap:6px}
.field{min-height:46px;border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:0 14px;min-width:0;flex:1 1 180px}
.namecard{display:grid;gap:14px;justify-items:center;text-align:center;padding-top:2vh}
.namecard .field{width:100%;max-width:320px;flex:none;text-align:center;font-size:1.15rem}
.namecard .btn.primary{width:100%;max-width:320px}
.buddies{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;width:100%}
.bud{display:grid;justify-items:center;gap:0;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:6px 2px 4px;font-size:.78rem;line-height:1.3;box-shadow:0 3px 0 var(--line-d);transition:transform .08s,box-shadow .08s;min-width:0}
.bud:active{transform:translateY(3px);box-shadow:none}
.bud[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 3px 0 var(--accent)}
.bud .rd{font-size:.72rem}
@media (max-width:520px){.buddies{grid-template-columns:repeat(4,1fr)}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.confetti i{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (max-width:420px){ h1{font-size:1.05rem} .pill{padding:4px 9px 4px 6px} .prompt .big{font-size:1.6rem} .score .v{font-size:1.4rem} .hero .deco{font-size:6.5rem} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs id="mdefs"></defs>
  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3c1 3 4 5 4 9a4 4 0 0 1-8 0c0-2 1-3 2-4 1-1 2-3 2-5z"/><path d="M12 21a7 7 0 0 0 7-7c0-2-1-4-2-5"/><path d="M5 14a7 7 0 0 0 7 7"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.500"/><circle cx="12" cy="12" r="6.500"/><path stroke-width="3.200" d="M12 2.500v3M12 18.500v3M2.500 12h3M18.500 12h3M5.300 5.300l2.100 2.100M16.600 16.600l2.100 2.100M5.300 18.700l2.100-2.100M16.600 7.400l2.100-2.100"/></symbol>
  <symbol id="i-say" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10H4z"/><path d="M16.500 8.500a5 5 0 0 1 0 7"/><path d="M19 6a8.500 8.500 0 0 1 0 12"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.500l4.500 4.500L19 7.500"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
</svg>

<div class="wrap">
  <main id="app" class="stack"></main>

// 出題エンジン（画面に依存しない。ブラウザでは app.html に埋め込み、node では test_engine.mjs から読む）
//   教材（語句・例文・文字）から問題を組み立て、採点し、成績・連続日数を計算する。
//   乱数は rng を渡せる（テストで再現するため）。
const Engine = (() => {
  let UNITS = [], ITEMS = {}, LESSONS = {}, ORDER = [], ALL = [];

  function init(units) {
    UNITS = units; ITEMS = {}; LESSONS = {}; ORDER = []; ALL = [];
    units.forEach((u, ui) => u.lessons.forEach(l => {
      l.ui = ui; l.unit = u.unit; l.li = ORDER.length;
      LESSONS[l.id] = l; ORDER.push(l.id);
      l.items.forEach(it => {
        it.lesson = l.id; it.li = l.li; it.ui = ui; it.n = ALL.length;
        it.kind = it.t === "c" ? "c" : /[.?!]$/.test(it.ko) ? "s" : "w";
        ITEMS[it.id] = it; ALL.push(it);
      });
    }));
  }

  const bare = s => s.replace(/[.?!]$/, "");
  const chunksOf = s => bare(s).split(" ");
  // 読みがな。mode: "rom" | "kana" | "off"（off のとき空文字）
  const reading = (it, mode) => mode === "kana" ? it.kana : mode === "rom" ? it.rom : "";
  // 「読みを選ぶ」問題は読みが必ず要るので、off のときはローマ字で出す
  const readMode = mode => mode === "kana" ? "kana" : "rom";

  const shuffle = (a, rng) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pick = (a, rng) => a[Math.floor(rng() * a.length)];

  // ---------- 誤答えらび ----------
  // 候補は「そのレッスンまでに出た教材」。問う側・答える側のどちらかの表示が正解と同じものは外す
  // （カタカナでは 어 と 오 がどちらも「オ」になる、訳が同じ語がある、といった場合に正解が2つにならないように）
  function distractors(target, promptOf, answerOf, n, rng, kinds) {
    const tp = promptOf(target), ta = answerOf(target);
    const seenA = new Set([ta]), seenP = new Set([tp]);
    const near = [], far = [];
    for (let k = ALL.length - 1; k >= 0; k--) {
      const it = ALL[k];
      if (it.li > target.li || it === target || !kinds.includes(it.kind)) continue;
      (it.li === target.li ? near : it.ui === target.ui ? near : far).push(it);
    }
    const out = [];
    for (const group of [shuffle(near, rng), far]) {       // まず同じユニットから。足りなければ近い順に前のユニットへ
      for (const it of group) {
        if (out.length >= n) break;
        const p = promptOf(it), a = answerOf(it);
        if (seenA.has(a) || seenP.has(p)) continue;
        seenA.add(a); seenP.add(p); out.push(it);
      }
    }
    return out;
  }

  // 聞いて区別できない組（애/에、외/왜/웨、잎/입）を同じとみなすための「音」。ローマ字から同音の母音をそろえる
  const sound = it => it.rom.replace(/wae|oe/g, "we").replace(/yae/g, "ye").replace(/ae/g, "e");
  const SIDE = {
    ko2ja: [it => it.ko, it => it.ja], ja2ko: [it => it.ja, it => it.ko],
    lis2ko: [sound, sound], lis2ja: [sound, it => it.ja],
  };

  // 4択。opts は教材idの並び、answer は正解の添字
  function choice(type, it, mode, rng) {
    let sides = SIDE[type], rmode = null;
    if (type === "read" || type === "read2ko") {
      rmode = readMode(mode);
      const r = x => x[rmode], k = x => x.ko;
      sides = type === "read" ? [k, r] : [r, k];
    }
    const kinds = it.kind === "c" ? ["c"] : it.kind === "s" ? ["s"] : ["w"];
    let ds = distractors(it, sides[0], sides[1], 3, rng, kinds);

function buddy(kind, mood, size){
  const k = BUDDIES[kind] ? kind : "tiger", b = BUDDIES[k], INK = b.ink;
  const c = { F: `url(#m-${k}-fur)`, C: `url(#m-${k}-cream)`, E: `url(#m-${k}-ear)`, INK, mood, S: `fill="none" stroke="${INK}" stroke-linecap="round" stroke-linejoin="round"` };
  const S = c.S, full = size >= 70;
  // 目
  const eye = x => `<ellipse cx="${x}" cy="93" rx="9.500" ry="12" fill="url(#m-eye)"/><circle cx="${x + 3.500}" cy="88" r="4" fill="#fff"/><circle cx="${x - 3.500}" cy="98" r="1.800" fill="#fff" opacity=".9"/>`;
  const eyes = mood === "happy" ? `<path d="M62 96q12-15 24 0M114 96q12-15 24 0" ${S} stroke-width="5.500"/>`
    : eye(74) + eye(126) + (mood === "cheer" ? `<path d="M62 77q10-7 21-3M138 77q-10-7-21-3" ${S} stroke-width="4.500"/>` : "");
  // 鼻と口。鼻面のある動物（うし・うま・ぶた など）は三角の鼻を描かず、口を小さくして鼻面の下へ下げる
  let face;
  if(b.beak){
    face = `<ellipse cx="100" cy="${mood === "happy" ? 134 : 128}" rx="7" ry="9" fill="#e5483b"/>` + (mood === "happy"
      ? `<path d="M86 106q14-7 28 0l-14 10z" fill="#f6b93b"/><path d="M90 116h20l-10 14z" fill="#e8962a"/>`
      : `<path d="M86 106q14-7 28 0q-4 13-14 18q-10-5-14-18z" fill="#f6b93b"/><path d="M89 113q11 4 22 0" ${S} stroke-width="2" opacity=".5"/>`);
  } else {
    const tf = !b.snout ? "" : b.coil ? `translate(0 2)` : `translate(20 36) scale(.8)`;
    const mouth = mood === "happy"
      ? `<path d="M84 117q16 4 32 0q-2 19-16 19q-14 0-16-19z" fill="#7d2b1c"/><path d="M90 130q10-7 20 0q-4 6-10 6q-6 0-10-6z" fill="#ff9a8a"/>`
      : mood === "cheer" ? (b.snout ? "" : `<path d="M100 113v4" ${S} stroke-width="3.500"/>`) + `<ellipse cx="100" cy="124" rx="7" ry="6.500" fill="#7d2b1c"/><ellipse cx="100" cy="127" rx="4" ry="2.500" fill="#ff9a8a"/>`
      : (b.snout ? "" : `<path d="M100 113v5" ${S} stroke-width="3.500"/>`) + `<path d="M100 118q-7 9-15 3M100 118q7 9 15 3" ${S} stroke-width="3.500"/>`;
    const nose = b.snout ? "" : `<path d="M91 104q9-5 18 0q-1 8-9 10q-8-2-9-10z" fill="${b.nose}"/><ellipse cx="97" cy="105" rx="3" ry="1.500" fill="#fff" opacity=".45"/>`;
    face = nose + `<g transform="${tf}">${mouth}</g>` + (b.tongue && mood === "normal" ? b.tongue(c) : "");
  }
  const head = b.behind(c) + (b.headBase ? b.headBase(c) : `<ellipse cx="100" cy="90" rx="72" ry="63" fill="${c.F}"/>`) + b.over(c)
    + `<ellipse cx="55" cy="114" rx="11" ry="7" fill="#ff8a73" opacity=".5"/><ellipse cx="145" cy="114" rx="11" ry="7" fill="#ff8a73" opacity=".5"/>` + eyes + face;
  if(!full) return `<svg class="tiger" width="${size}" height="${size}" viewBox="-2 -36 204 204" aria-hidden="true">${head}</svg>`;
  const shadow = `<ellipse cx="100" cy="221" rx="${b.coil ? 66 : 54}" ry="7" fill="#000" opacity=".12"/>`;
  let body;
  if(b.coil){   // へび: 手足の代わりにとぐろ。しっぽの先の上げ方でポーズを変える
    const tip = mood === "happy" ? "M150 204q40-4 34-46" : mood === "cheer" ? "M150 204q36 0 34-34" : "M150 206q30 2 32-18";
    const ring = (y, rx) => `<ellipse cx="100" cy="${y}" rx="${rx}" ry="17" fill="${c.F}"/><path d="M${100 - rx + 10} ${y + 8}q${rx - 10} 12 ${2 * rx - 20} 0" ${S} stroke-width="3" opacity=".22"/>`;
    body = `<path d="${tip}" fill="none" stroke="${b.fur[1]}" stroke-width="14" stroke-linecap="round"/>` + ring(206, 62) + ring(188, 49) + ring(170, 37)
      + `<ellipse cx="100" cy="164" rx="20" ry="9" fill="${c.C}"/>`;
  } else {
    // 腕: [付け根x, 付け根y, 角度]。角度は「真上が0、時計回りが正」。下ろした腕は200°前後
    const aF = b.armFill ? b.armFill(c) : c.F, paw = b.paw || c.C;
    const arm = (x, y, deg) => `<g transform="translate(${x} ${y}) rotate(${deg})"><ellipse cx="0" cy="-17" rx="12" ry="22" fill="${aF}"/>${b.armMark ? b.armMark(c) : ""}${b.beak ? "" : `<ellipse cx="0" cy="-31" rx="7" ry="5.500" fill="${paw}"/>`}</g>`;
    const arms = mood === "happy" ? arm(62, 164, -52) + arm(138, 164, 52) : mood === "cheer" ? arm(64, 160, 208) + arm(140, 166, 24) : arm(64, 160, 205) + arm(139, 165, 48);
    body = (b.tail ? b.tail(c) : "")
      + `<ellipse cx="78" cy="212" rx="21" ry="11" fill="${b.foot}"/><ellipse cx="122" cy="212" rx="21" ry="11" fill="${b.foot}"/>`
      + (b.paw || b.beak ? "" : `<ellipse cx="74" cy="214" rx="10" ry="5" fill="${c.C}"/><ellipse cx="126" cy="214" rx="10" ry="5" fill="${c.C}"/>`)
      + (b.bodyBase ? b.bodyBase(c) : `<ellipse cx="100" cy="178" rx="44" ry="40" fill="${c.F}"/><ellipse cx="100" cy="186" rx="27" ry="28" fill="${c.C}"/>`)
      + (b.marks ? b.marks(c) : "") + arms;
  }
  return `<svg class="tiger" width="${size}" height="${Math.round(size * 1.300)}" viewBox="0 -36 200 266" aria-hidden="true">${shadow}${body}${head}</svg>`;
}

let koVoice = null;
function findVoice(){ try{ koVoice = speechSynthesis.getVoices().find(v => /^ko/i.test(v.lang)) || null; }catch(e){ koVoice = null; } }

function speak(text){
  if(!canSpeak()) return;
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(Engine.bare(text)); u.lang = "ko-KR"; u.voice = koVoice; u.rate = state.set.rate; speechSynthesis.speak(u); }catch(e){}
}

// ---------- 出題 ----------
const INSTR = { ko2ja: "意味を選んでください", ja2ko: "韓国語を選んでください", lis2ko: "聞こえた韓国語を選んでください", lis2ja: "聞こえた言葉の意味を選んでください",
  read: "読み方を選んでください", read2ko: "この読み方の文字を選んでください", match: "ペアを作ってください", order: "韓国語に並べてください",
  lisorder: "聞こえたとおりに並べてください", cloze: "空欄に入るものを選んでください" };
let Q = null;   // {kind, arg, list, i, total, ok, n, missed, miss, xp0:始める前の今日のXP, st0:始める前の連続日数, a:今の問題の回答状態}

function startSession(kind, arg){
  const o = { mode: state.set.reading, audio: canSpeak(), rng: Math.random, day: today() };
  const list = kind === "lesson" ? Engine.buildLesson(arg, state, o) : kind === "jump" ? Engine.buildJump(arg, o) : Engine.buildPractice(state, o);
  if(!list.length) return goHome(curUnit);
  Q = { kind, arg, list, i: 0, total: list.length, ok: 0, n: 0, missed: [], miss: 0, a: null };
  newQuestion();
}
function newQuestion(){
  const ex = Q.list[Q.i];
  Q.a = { done: false, pick: -1, line: [], sel: null, matched: [], wrongPair: null, bad: new Set(), ok: null };
  renderQuestion();
  window.scrollTo(0, 0);
  if(ex.type.startsWith("lis")) speak(I(ex.id).ko);
}
const subOf = (ex, it) => (ex.type === "lis2ko" || ex.type === "read2ko") && !Q.a.done ? "" : rdHtml(it);

function promptHtml(ex){
  const it = I(ex.id), a = Q.a;
  if(ex.type === "match") return "";
  if(ex.type.startsWith("lis")) return sayBtn(it.ko, true);
  if(ex.type === "ko2ja") return `<div class="big">${koHtml(it)}</div>${rdHtml(it)}${sayBtn(it.ko)}`;
  if(ex.type === "read") return `<div class="big ${it.kind === "c" ? "letter" : ""}">${koHtml(it)}</div>`;
  if(ex.type === "read2ko") return `<div class="big">${esc(it[ex.rmode])}</div>`;
  if(ex.type === "cloze"){
    const fill = a.done ? esc(ex.opts[ex.answer]) : a.pick >= 0 ? esc(ex.opts[a.pick]) : "　";
    return `<div class="big ko" lang="ko">${esc(ex.parts[0])}<span class="blank">${fill}</span>${esc(ex.parts[1])}</div><div>${esc(it.ja)}</div>`;
  }
  return `<div class="big ja">${esc(it.ja)}</div>`;   // ja2ko, order
}

function bodyHtml(ex){
  const a = Q.a;
  if(ex.type === "match"){
    const cell = (id, side) => {
      const it = I(id), done = a.matched.includes(id), key = side + id;
      const cls = done ? "right gone" : a.sel === key ? "sel" : a.wrongPair && a.wrongPair.includes(key) ? "wrong" : "";
      const inner = side === "L" ? `<span class="t ko" lang="ko">${esc(it.ko)}</span>${ex.side === "ja" ? rdHtml(it) : ""}` : `<span class="t">${esc(ex.side === "ja" ? it.ja : it[ex.rmode])}</span>`;
      return `<button class="opt ${cls}" data-m="${key}" ${done ? "disabled" : ""}>${inner}</button>`;
    };
    return `<div class="opts pairs">${ex.left.map((id, k) => cell(id, "L") + cell(ex.right[k], "R")).join("")}</div>`;
  }
  if(ex.type === "order" || ex.type === "lisorder"){
    const tile = (k, where) => { const t = ex.tiles[k], r = state.set.reading === "off" || ex.type === "lisorder" && !a.done ? "" : t[state.set.reading];
      return `<button class="tile ${where === "bank" && a.line.includes(k) ? "used" : ""}" data-tile="${k}" data-where="${where}" ${a.done ? "disabled" : ""}><span class="ko" lang="ko">${esc(t.t)}</span>${r ? `<span class="rd">${esc(r)}</span>` : ""}</button>`; };
    return `<div class="line" id="line">${a.line.map(k => tile(k, "line")).join("")}</div>
      <div class="bank">${ex.tiles.map((_, k) => tile(k, "bank")).join("")}</div>
      ${a.done ? "" : `<button class="btn primary wide" id="checkorder" ${a.line.length ? "" : "disabled"}>答え合わせ</button>`}`;
  }
  const cls = k => !a.done ? "" : k === ex.answer ? "right" : k === a.pick ? "wrong" : "";
  if(ex.type === "cloze")
    return `<div class="opts two">${ex.opts.map((t, k) => `<button class="opt ${cls(k)}" data-opt="${k}" ${a.done ? "disabled" : ""}><span class="t ko" lang="ko">${esc(t)}</span></button>`).join("")}</div>`;
  const ansSide = ex.type === "ko2ja" || ex.type === "lis2ja" ? "ja" : ex.type === "read" ? "read" : "ko";
  return `<div class="opts ${ansSide === "ja" ? "" : "two"}">${ex.opts.map((id, k) => { const it = I(id);
    const inner = ansSide === "ja" ? `<span class="t">${esc(it.ja)}</span>` : ansSide === "read" ? `<span class="t">${esc(it[ex.rmode])}</span>` : `<span class="t ko" lang="ko">${esc(it.ko)}</span>${subOf(ex, it)}`;
    return `<button class="opt ${cls(k)}" data-opt="${k}" ${a.done ? "disabled" : ""}>${inner}</button>`; }).join("")}</div>`;
}

function feedbackHtml(ex){
  const a = Q.a;
  if(!a.done) return "";
  const last = Q.i + 1 >= Q.list.length;
  let ans = "";
  if(ex.type !== "match"){
    const it = I(ex.id);
    ans = `<div class="answer"><div class="row">${koHtml(it)}${sayBtn(it.ko)}</div>${rdHtml(it)}${it.ja ? `<div>${esc(it.ja)}</div>` : ""}${it.note ? `<div class="small muted">${esc(it.note)}</div>` : ""}</div>`;
  }
  return `<div class="sheetpad"></div><section class="sheet ${a.ok ? "ok" : "ng"}" id="feedback"><div class="in">
    <div class="top">${pal(a.ok ? "happy" : "cheer", 52)}<div><div class="verdict">${a.ok ? "正解！" : ex.type === "match" ? "間違えたペアがありました" : "不正解"}</div>${ans}</div></div>
    <button class="btn primary wide" id="next">${last ? "結果を見る" : "次へ"}</button></div></section>`;
}

function renderQuestion(){
  view = "quiz";
  const ex = Q.list[Q.i];
  app.innerHTML = `<div class="qbar"><button class="iconbtn" id="quit" aria-label="やめる">${icon("x")}</button>
      <div class="bar"><i style="width:${Q.i / Q.list.length * 100}%"></i></div>
      <button class="rtoggle" id="rtoggle">読みがな: ${READING[state.set.reading]}</button></div>
    <div class="label">${INSTR[ex.type]}${Q.i >= Q.total ? "　（もう一度）" : ""}</div>
    <div class="prompt">${promptHtml(ex)}</div>
    ${bodyHtml(ex)}
    ${feedbackHtml(ex)}`;
}

// 回答を確定する。marks は成績を付ける教材（ペア合わせは複数）
function finish(ok, marks){
  const ex = Q.list[Q.i], a = Q.a, day = today();
  a.done = true; a.ok = ok;
  marks.forEach(([id, good]) => Engine.record(state, id, good, day));
  if(Q.i < Q.total){ Q.n++; if(ok) Q.ok++; }
  if(!ok){
    Q.miss++;
    if(Q.kind !== "jump" && !ex.again){ Q.list.push(Object.assign({}, ex, { again: true })); if(ex.type !== "match") Q.missed.push(ex.id); }   // 間違えた問題は最後にもう一度
  }
  save();
  renderQuestion();
  if(ex.type !== "match") speak(I(ex.id).ko);
  const nb = document.getElementById("next"); if(nb) nb.focus({ preventScroll: true });
}

function tapMatch(key){
  const ex = Q.list[Q.i], a = Q.a;
  a.wrongPair = null;
  if(key[0] === "L") speak(I(key.slice(1)).ko);
  if(!a.sel || a.sel[0] === key[0]){ a.sel = a.sel === key ? null : key; return renderQuestion(); }
  const [l, r] = key[0] === "L" ? [key, a.sel] : [a.sel, key];
  const il = I(l.slice(1)), ir = I(r.slice(1)), R = it => ex.side === "ja" ? it.ja : it[ex.rmode];
  a.sel = null;
  if(il === ir || il.ko === ir.ko && R(il) === R(ir)) a.matched.push(il.id);
  else { a.wrongPair = [l, r]; a.bad.add(il.id); a.bad.add(ir.id); }
  if(a.matched.length === ex.left.length) return finish(a.bad.size === 0, ex.left.map(id => [id, !a.bad.has(id)]));
  renderQuestion();
}

function nextStep(){
  Q.i++;
  if(Q.i < Q.list.length) return newQuestion();
  renderResult();
}

// ---------- 結果（名前＋労いの一言） ----------
let afterUnit;
function confetti(){
  if(calm()) return;
  const box = document.createElement("div"); box.className = "confetti";
  const colors = ["#f2a03d", "#0f7b6c", "#2563a8", "#6b4aa8", "#e2a100", "#ee7f76"];
  box.innerHTML = Array.from({ length: 36 }, (_, k) => `<i style="left:${Math.random() * 100}%;background:${colors[k % colors.length]};animation-duration:${1.6 + Math.random() * 1.6}s;animation-delay:${Math.random() * 0.5}s"></i>`).join("");
  document.body.appendChild(box); setTimeout(() => box.remove(), 4000);
}
function countUp(el, to){
  if(calm() || !to){ el.textContent = "+" + to; return; }
  const t0 = performance.now(), step = t => { const p = Math.min(1, (t - t0) / 700); el.textContent = "+" + Math.round(to * p); if(p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

function renderResult(){
  view = "result";
  const day = today(), before = Engine.streak(state, day), xp0 = state.days[day] || 0, goal = state.set.goal;
  let xp = Q.ok, title = "レッスン完了", note = "", pass = false;
  if(Q.kind === "lesson"){
    const wasNext = Engine.nextLesson(state) === Q.arg;
    xp += 5; state.done[Q.arg] = (state.done[Q.arg] || 0) + 1;
    afterUnit = wasNext ? frontier() : Engine.lessons[Q.arg].ui;      // 先頭のレッスンを終えたら次のユニットへ、やり直しなら同じユニットへ戻る
  }
  else if(Q.kind === "practice"){ title = "復習完了"; afterUnit = curUnit; }
  else {
    pass = Q.miss <= Engine.JUMP_MISS;
    title = pass ? "飛び級 合格" : "飛び級 不合格";
    note = pass ? "ここまでのレッスンを開きました。" : `間違いは${Engine.JUMP_MISS}問までです（今回 ${Q.miss}問）。前のユニットを進めてからもう一度どうぞ。`;
    if(pass){ Engine.passJump(state, Q.arg); xp += 10; } else xp = 0;
    afterUnit = pass ? Q.arg : curUnit;
  }
  if(xp) Engine.addXp(state, xp, day);
  const st = Engine.streak(state, day), todayXp = state.days[day] || 0, acc = Q.n ? Q.ok / Q.n : 0;
  const ch = Engine.cheer({ kind: Q.kind, pass, acc, streak: st, streakUp: st > before, goalHit: xp0 < goal && todayXp >= goal }, state.lastCheer, Math.random);
  state.lastCheer = ch.text;
  save();
  const missed = [...new Set(Q.missed)].map(I);
  const next = Engine.nextLesson(state), kr = Engine.reading(ch.ko, state.set.reading);
  app.innerHTML = headHtml() + `
    <h2 id="resulttitle">${title}</h2>
    <section class="talk">${pal(ch.mood, 112)}<div class="bubble" id="cheer">
      <div>${who() ? `<span class="who">${who()}、</span>` : ""}<span id="cheertext">${esc(ch.text)}</span></div>
      <div class="kline">${sayBtn(ch.ko.ko)}<span><b class="ko" lang="ko">${esc(ch.ko.ko)}</b>${kr ? ` <span class="rd">${esc(kr)}</span>` : ""}<span class="small muted ja">${esc(ch.ko.ja)}</span></span></div>
    </div></section>
    ${note ? `<p>${note}</p>` : ""}
    <section class="score">
      <div class="cell xp"><div class="label">獲得XP</div><div class="v" id="gotxp" data-xp="${xp}">+${xp}</div></div>
      <div class="cell"><div class="label">正答率</div><div class="v">${Math.round(acc * 100)}%</div></div>
      <div class="cell"><div class="label">連続</div><div class="v">${st}<span class="small">日</span></div></div>
    </section>
    <section class="card goalrow">${ring(todayXp / goal * 100, 52)}<div><div><b>今日 <span class="num">${todayXp}</span> / <span class="num">${goal}</span> XP</b></div>
      <div class="small muted">${todayXp >= goal ? "今日の目標を達成しました。" : `今日の目標まであと ${goal - todayXp} XP。`}</div></div></section>
    ${missed.length ? `<section class="card vocab"><h3>間違えた言葉</h3>${missed.map(it => `<div class="vrow">${sayBtn(it.ko) || "<span></span>"}<div><div class="k">${koHtml(it)}</div><div>${rdHtml(it)}${it.ja ? `${rd(it) ? "　" : ""}${esc(it.ja)}` : ""}</div></div></div>`).join("")}</section>` : ""}
    <div class="row">${next && Q.kind === "lesson" ? `<button class="btn primary" id="gonext" data-lesson="${next}">次のレッスンへ</button>` : ""}<button class="btn" id="home">道筋にもどる</button></div>`;
  countUp(document.getElementById("gotxp"), xp);
  if(ch.mood === "happy") confetti();
  Q = null;
  window.scrollTo(0, 0);
}

// ---------- 操作 ----------
function saveName(id){ state.name = cleanName(document.getElementById(id).value); save(); }
app.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.say !== undefined) return speak(b.dataset.say);
  if(b.dataset.buddy){ state.set.buddy = b.dataset.buddy; save(); return view === "name" ? renderName() : renderHome(); }
  if(b.id === "namesave"){ saveName("nameinput"); return goHome(); }
  if(b.id === "nameskip"){ state.name = ""; save(); return goHome(); }
  if(b.id === "setnamesave"){ saveName("setname"); return renderHome(); }
  if(b.id === "gear"){ showSettings = !showSettings; return renderHome(); }
  if(b.id === "uprev" || b.id === "unext"){ curUnit += b.id === "unext" ? 1 : -1; return renderHome(); }
  if(b.dataset.set){
    const k = b.dataset.set, v = b.dataset.val;
    state.set[k] = k === "reading" ? v : k === "audio" ? v === "true" : +v;
    save(); return renderHome();
  }
  if(b.id === "reset"){ document.getElementById("resetbox").innerHTML = `<span class="small">連続日数もXPも消えます（お名前と設定は残ります）。</span><button class="btn" id="reset2">消す</button><button class="btn" id="reset0">やめる</button>`; return; }
  if(b.id === "reset2"){ const keep = { set: state.set, name: state.name }; state = Object.assign(Engine.newState(), keep); save(); return goHome(); }
  if(b.id === "reset0") return renderHome();
  if(b.id === "home") return goHome(afterUnit);
  if(b.id === "back") return goHome(curUnit);
  if(b.id === "rtoggle"){
    const order = ["rom", "kana", "off"]; state.set.reading = order[(order.indexOf(state.set.reading) + 1) % 3]; save();
    return view === "intro" ? renderIntro(document.getElementById("start").dataset.lesson) : renderQuestion();
  }
  if(b.id === "practice") return startSession("practice");
  if(b.dataset.jump !== undefined) return startSession("jump", +b.dataset.jump);
  if(b.id === "start") return startSession("lesson", b.dataset.lesson);
  if(b.dataset.lesson) return renderIntro(b.dataset.lesson);
  if(b.id === "quit"){ Q = null; return goHome(curUnit); }
  if(b.id === "next") return nextStep();
  if(!Q || Q.a.done) return;
  const ex = Q.list[Q.i], a = Q.a;
  if(b.dataset.opt !== undefined){ a.pick = +b.dataset.opt; return finish(a.pick === ex.answer, [[ex.id, a.pick === ex.answer]]); }
  if(b.dataset.m) return tapMatch(b.dataset.m);
  if(b.dataset.tile !== undefined){
    const k = +b.dataset.tile;
    if(b.dataset.where === "line") a.line = a.line.filter(x => x !== k); else { a.line.push(k); speak(ex.tiles[k].t); }
    return renderQuestion();
  }
  if(b.id === "checkorder"){ const ok = Engine.gradeOrder(ex, a.line.map(k => ex.tiles[k])); return finish(ok, [[ex.id, ok]]); }
});
app.addEventListener("input", e => { if(e.target.id === "nameinput") draftName = e.target.value; });
app.addEventListener("change", e => { if(e.target.id === "unitsel"){ curUnit = +e.target.value; renderHome(); } });
document.addEventListener("keydown", e => {
  if(e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
  if(e.key === "Enter" && e.target.id === "nameinput") return document.getElementById("namesave").click();
  if(e.key === "Enter" && e.target.id === "setname") return document.getElementById("setnamesave").click();
  if(view !== "quiz" || !Q) return;
  if(e.key === "Enter"){ const b = document.getElementById("next") || document.getElementById("checkorder"); if(b && !b.disabled){ e.preventDefault(); b.click(); } return; }

});
